<body>
    <div id="root">
        <div class="safe-area">
            <div class="status-bar"></div>
            <div id="app-content">
                <div class="loading-container"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="agendaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">📅 Novo Compromisso</h3>
                <button class="modal-close" onclick="fecharModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" onclick="salvarCompromisso()">✓ <span id="modalConfirmText">Criar compromisso</span></button>
            </div>
        </div>
    </div>

    <script>
        // ========== ESTADO GLOBAL ==========
        const AppState = { user: null, loadingSessao: true, currentScreen: 'loading' };
        const Tabs = [{ name: 'Home', label: 'Início', icon: '🏠' },{ name: 'Diario', label: 'Bloco de notas', icon: '📖' },{ name: 'Agenda', label: 'Agenda', icon: '📅' },{ name: 'Perfil', label: 'Perfil', icon: '👤' }];
        let currentTab = 'Home', intervaloFrases = null, intervaloDicas = null, indiceFraseAtual = 0, indiceDicaAtual = 0;

        // ========== NAVEGAÇÃO ==========
        function navigateTo(screen) {
            const container = document.getElementById('app-content');
            AppState.currentScreen = screen;
            if (screen === 'MainApp') renderMainApp(container);
            else if (screen === 'Login') renderLogin(container);
        }
        function renderMainApp(container) {
            container.innerHTML = '<div class="main-container"><div class="screen-content" id="screen-content"></div><div class="tab-bar">'+Tabs.map(tab => '<div class="tab-item '+(tab.name===currentTab?'active':'')+'" onclick="switchTab(\''+tab.name+'\')"><span class="tab-icon">'+tab.icon+'</span><span class="tab-label">'+tab.label+'</span></div>').join('')+'</div></div>';
            renderHome(document.getElementById('screen-content'));
        }
        function switchTab(tabName) {
            currentTab = tabName; const sc = document.getElementById('screen-content');
            if(!sc)return;
            if(intervaloFrases)clearInterval(intervaloFrases); if(intervaloDicas)clearInterval(intervaloDicas);
            document.querySelectorAll('.tab-item').forEach((item,i)=>{ item.classList.toggle('active',Tabs[i].name===tabName); });
            sc.classList.remove('screen-transition');
            void sc.offsetWidth;
            sc.classList.add('screen-transition');
            if(tabName==='Home')renderHome(sc); else if(tabName==='Diario')renderDiario(sc); else if(tabName==='Agenda')renderAgenda(sc); else if(tabName==='Perfil')renderPerfil(sc);
        }

        // ========== LOGIN ==========
        function renderLogin(container) {
            container.innerHTML = '<div class="login-screen"><div class="login-content"><div class="login-logo-container"><div class="login-logo"><span class="login-logo-icon">🌿</span></div><h1 class="login-app-name">Organiza-Me</h1><p class="login-app-subtitle">Organize sua vida com mais leveza</p></div><div class="login-form"><h2 class="login-welcome">👋 Olá!</h2><p class="login-welcome-subtext">Digite seu nome para começar sua jornada de organização pessoal.</p><div class="login-input-container"><span class="login-input-icon">👤</span><input type="text" id="nomeInput" class="login-input" placeholder="Seu nome" autofocus /></div><button id="btnEntrar" class="login-button" onclick="handleEntrar()"><span id="btnText">Começar</span><span id="btnIcon" class="login-button-icon">→</span></button></div><p class="login-footer-text">Organize seus pensamentos, organize sua vida.</p></div></div>';
            document.getElementById('nomeInput').addEventListener('keypress',function(e){if(e.key==='Enter')handleEntrar();});
        }
        function handleEntrar(){
            const nome=document.getElementById('nomeInput').value.trim();
            if(!nome){alert('Ops! Digite seu nome.');return;}
            const btn=document.getElementById('btnEntrar'),btnText=document.getElementById('btnText'),btnIcon=document.getElementById('btnIcon');
            btn.disabled=true;btn.style.opacity='0.6';btnText.textContent='Entrando...';btnIcon.style.display='none';
            setTimeout(()=>{const user={nome:nome};localStorage.setItem('user',JSON.stringify(user));AppState.user=user;navigateTo('MainApp');},500);
        }

        // ========== DADOS ==========
        const FRASES_MOTIVACIONAIS=["Acredite em você e tudo será possível.","Pequenas ações diárias criam grandes resultados.","Você é mais forte do que imagina.","O sucesso começa com a decisão de tentar.","Não espere por oportunidades, crie-as.","A persistência é o caminho para o sucesso.","Seja a mudança que você quer ver no mundo.","Cada dia é uma nova oportunidade.","Você é capaz de coisas incríveis.","A jornada de mil milhas começa com um passo.","O fracasso é apenas uma oportunidade para recomeçar.","Sua única limitação é sua mente.","Acredite no poder dos seus sonhos.","O melhor momento para começar é agora.","Não desista, o melhor ainda está por vir.","Grandes coisas nunca vêm de zonas de conforto.","A felicidade não é um destino, é uma jornada.","Você é o protagonista da sua própria história.","Cada erro é uma lição aprendida.","O otimismo é a fé que leva à realização."];
        const DICAS_BEM_ESTAR=[{titulo:'🧘 Respire fundo',descricao:'Pare por 1 minuto e respire profundamente.'},{titulo:'💧 Beba água',descricao:'Mantenha-se hidratado. Beba um copo de água.'},{titulo:'🚶 Dê uma pausa',descricao:'Levante-se, alongue-se e dê alguns passos.'},{titulo:'📝 Liste 3 coisas boas',descricao:'Pense em 3 coisas boas que aconteceram.'},{titulo:'😴 Durma bem',descricao:'Uma boa noite de sono é essencial.'},{titulo:'📱 Desconecte-se',descricao:'Desligue as notificações por 30 minutos.'},{titulo:'🎵 Ouça música',descricao:'Coloque uma música que te faz bem.'},{titulo:'🌿 Contato com a natureza',descricao:'Dê uma volta ao ar livre.'},{titulo:'🍵 Tome um chá',descricao:'Prepare um chá quentinho e relaxe.'},{titulo:'📖 Leia um livro',descricao:'Separe 15 minutos para ler algo que gosta.'},{titulo:'🧠 Medite',descricao:'Foque na sua respiração por 5 minutos.'},{titulo:'🤗 Abrace alguém',descricao:'Um abraço sincero pode melhorar seu dia.'},{titulo:'🌅 Aproveite o nascer do sol',descricao:'Acorde mais cedo e aprecie o nascer do sol.'},{titulo:'✍️ Escreva seus sentimentos',descricao:'Coloque no papel o que está sentindo.'},{titulo:'🎨 Faça algo criativo',descricao:'Desenhe, pinte ou faça artesanato.'},{titulo:'🧹 Organize um espaço',descricao:'Organize sua mesa ou um cômodo da casa.'},{titulo:'☀️ Tome sol',descricao:'Aproveite 15 minutos de sol pela manhã.'},{titulo:'🧘 Alongue-se',descricao:'Faça alguns alongamentos para soltar o corpo.'},{titulo:'📵 Detox digital',descricao:'Fique 1 hora sem celular e redes sociais.'},{titulo:'💭 Pratique a gratidão',descricao:'Agradeça por algo pequeno hoje.'}];

        // ========== HOME ==========
        function renderHome(container){
            if(intervaloFrases)clearInterval(intervaloFrases);if(intervaloDicas)clearInterval(intervaloDicas);
            const user=AppState.user||{nome:'Usuário'},nome=user.nome||'Usuário',primeiraLetra=nome.charAt(0).toUpperCase();
            const saudacao=()=>{const hora=new Date().getHours();return hora>=5&&hora<12?'Bom dia':hora>=12&&hora<18?'Boa tarde':'Boa noite';};
            const fotoPerfil=localStorage.getItem('@organizame:foto_perfil')||null;
            container.innerHTML='<div class="home-screen"><div class="home-header"><div><p class="home-saudacao">👋 '+saudacao()+'!</p><h1 class="home-titulo">'+nome+'</h1></div>'+(fotoPerfil?'<img src="'+fotoPerfil+'" class="home-avatar-img" alt="Foto" />':'<div class="home-avatar"><span class="home-avatar-letra">'+primeiraLetra+'</span></div>')+'</div><div class="home-frases-container" id="frasesContainer"><div class="home-frases-track" id="frasesTrack"></div><div class="home-indicadores" id="frasesIndicadores"></div></div><div class="home-compromissos-section"><div class="home-secao-header"><h3 class="home-section-title">📅 Próximos Compromissos</h3><button class="home-link-btn" onclick="switchTab(\'Agenda\')">Ver todos</button></div><div id="compromissosContainer"></div></div><div class="home-dicas-section"><div class="home-dicas-header"><h3 class="home-dicas-title">🌿 Inspire-se</h3><span class="home-dicas-counter" id="dicasCounter">1/20</span></div><div class="home-dicas-track" id="dicasTrack"></div><div class="home-indicadores" id="dicasIndicadores"></div></div><div style="height:40px;"></div></div>';
            setTimeout(()=>{inicializarFrases();carregarCompromissos();inicializarDicas();},100);
        }
        function inicializarFrases(){
            const track=document.getElementById('frasesTrack'),indicadores=document.getElementById('frasesIndicadores');if(!track||!indicadores)return;
            track.innerHTML=FRASES_MOTIVACIONAIS.map((frase,index)=>'<div class="home-frase-card '+(index===indiceFraseAtual?'active':'')+'"><p class="home-frase-texto">"'+frase+'"</p></div>').join('');
            indicadores.innerHTML=FRASES_MOTIVACIONAIS.map((_,index)=>'<div class="home-dot '+(index===indiceFraseAtual?'active':'')+'"></div>').join('');
            if(intervaloFrases)clearInterval(intervaloFrases);
            intervaloFrases=setInterval(()=>{indiceFraseAtual=(indiceFraseAtual+1)%FRASES_MOTIVACIONAIS.length;atualizarFrases();},4000);
        }
        function atualizarFrases(){document.querySelectorAll('.home-frase-card').forEach((c,i)=>c.classList.toggle('active',i===indiceFraseAtual));document.querySelectorAll('#frasesIndicadores .home-dot').forEach((d,i)=>d.classList.toggle('active',i===indiceFraseAtual));}
        function inicializarDicas(){
            const track=document.getElementById('dicasTrack'),indicadores=document.getElementById('dicasIndicadores'),counter=document.getElementById('dicasCounter');if(!track||!indicadores)return;
            track.innerHTML=DICAS_BEM_ESTAR.map((dica,index)=>'<div class="home-dica-card '+(index===indiceDicaAtual?'active':'')+'"><p class="home-dica-titulo">'+dica.titulo+'</p><p class="home-dica-descricao">'+dica.descricao+'</p></div>').join('');
            indicadores.innerHTML=DICAS_BEM_ESTAR.map((_,index)=>'<div class="home-dot '+(index===indiceDicaAtual?'active':'')+'"></div>').join('');
            if(counter)counter.textContent=(indiceDicaAtual+1)+'/'+DICAS_BEM_ESTAR.length;
            if(intervaloDicas)clearInterval(intervaloDicas);
            intervaloDicas=setInterval(()=>{indiceDicaAtual=(indiceDicaAtual+1)%DICAS_BEM_ESTAR.length;atualizarDicas();},5000);
        }
        function atualizarDicas(){document.querySelectorAll('.home-dica-card').forEach((c,i)=>c.classList.toggle('active',i===indiceDicaAtual));document.querySelectorAll('#dicasIndicadores .home-dot').forEach((d,i)=>d.classList.toggle('active',i===indiceDicaAtual));const counter=document.getElementById('dicasCounter');if(counter)counter.textContent=(indiceDicaAtual+1)+'/'+DICAS_BEM_ESTAR.length;}
        function carregarCompromissos(){
            const container=document.getElementById('compromissosContainer');if(!container)return;
            const user=AppState.user,email=user?.email||user?.nome||'usuario';
            try{
                const dadosString=localStorage.getItem('@slots_'+email);let compromissos=[];
                if(dadosString){const dados=JSON.parse(dadosString),hoje=new Date().toISOString().split('T')[0];Object.keys(dados).forEach(data=>{if(data>=hoje){dados[data].forEach(slot=>{compromissos.push({id:slot.id,titulo:slot.titulo||'Compromisso',descricao:slot.descricao||'',data:data,horaInicio:slot.horaInicio,horaFim:slot.horaFim,prioridade:slot.prioridade||'media'});});}});compromissos.sort((a,b)=>{if(a.data!==b.data)return a.data.localeCompare(b.data);return a.horaInicio.localeCompare(b.horaInicio);});}
                const proximos=compromissos.slice(0,5);
                if(proximos.length===0){container.innerHTML='<div class="home-empty-compromissos"><span style="font-size:32px;">📅</span><p class="home-empty-text">Nenhum compromisso agendado</p><button class="home-agendar-btn" onclick="switchTab(\'Agenda\')">+ Agendar</button></div>';}
                else{container.innerHTML=proximos.map(item=>{const prioridadeCor=item.prioridade==='alta'?'#EF4444':item.prioridade==='media'?'#F59E0B':'#22C55E';const prioridadeTexto=item.prioridade==='alta'?'🔴 Alta':item.prioridade==='media'?'🟡 Média':'🟢 Baixa';const dataFormatada=new Date(item.data+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'});return'<div class="home-compromisso-card" onclick="switchTab(\'Agenda\')"><div class="home-compromisso-header"><div class="home-compromisso-left"><div class="home-prioridade-dot" style="background-color:'+prioridadeCor+';"></div><div><p class="home-compromisso-titulo">'+item.titulo+'</p><p class="home-compromisso-horario">'+dataFormatada+' • '+item.horaInicio+' - '+item.horaFim+'</p>'+(item.descricao?'<p class="home-compromisso-descricao">'+item.descricao+'</p>':'')+'</div></div><span class="home-compromisso-tag" style="color:'+prioridadeCor+';">'+prioridadeTexto+'</span></div></div>';}).join('');}
            }catch(error){container.innerHTML='<div class="home-empty-compromissos"><p class="home-empty-text">Erro ao carregar compromissos</p></div>';}
        }

        // ========== DIÁRIO ==========
        let diarioNotaEditandoId = null;

        function getNotasDiario(){
            const hoje=new Date().toISOString().split('T')[0];
            const chave='@diario_'+hoje;
            try{
                const salvo=localStorage.getItem(chave);
                if(!salvo)return [];
                const dados=JSON.parse(salvo);
                if(Array.isArray(dados))return dados;
                if(typeof dados==='string' && dados.trim())return [{id:'nota-legado-'+hoje,texto:dados,data:new Date().toISOString()}];
                return [];
            }catch(e){
                const texto=localStorage.getItem(chave)||'';
                return texto.trim()?[{id:'nota-legado-'+hoje,texto:texto,data:new Date().toISOString()}]:[];
            }
        }

        function salvarNotasDiario(notas){
            const hoje=new Date().toISOString().split('T')[0];
            localStorage.setItem('@diario_'+hoje,JSON.stringify(notas));
        }

        function escaparHtmlDiario(texto){
            return String(texto).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function renderDiario(container){
            const hoje=new Date().toISOString().split('T')[0];
            const notas=getNotasDiario();
            const dataFormatada=new Date(hoje+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
            let notasHtml='';
            if(notas.length===0){
                notasHtml='<div class="diario-sem-notas">Nenhuma anotação salva hoje.</div>';
            }else{
                notasHtml=notas.slice().reverse().map(function(nota){
                    const hora=nota.data?new Date(nota.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
                    const estaEditando=diarioNotaEditandoId===nota.id;
                    if(estaEditando){
                        return '<div class="diario-nota-card"><div class="diario-nota-data">📅 '+dataFormatada+(hora?' • '+hora:'')+'</div><textarea class="diario-nota-editando" id="diarioEdit_'+nota.id+'">'+escaparHtmlDiario(nota.texto)+'</textarea><div class="diario-edicao-acoes"><button class="diario-edicao-btn diario-edicao-salvar" onclick="salvarEdicaoDiario(\''+nota.id+'\')">💾 Salvar</button><button class="diario-edicao-btn diario-edicao-cancelar" onclick="cancelarEdicaoDiario()">Cancelar</button></div></div>';
                    }
                    return '<div class="diario-nota-card"><div class="diario-nota-data">📅 '+dataFormatada+(hora?' • '+hora:'')+'</div><div class="diario-nota-texto">'+escaparHtmlDiario(nota.texto)+'</div><div class="diario-nota-acoes"><button class="diario-nota-btn diario-nota-btn-editar" onclick="editarNotaDiario(\''+nota.id+'\')">✏️ Editar</button><button class="diario-nota-btn diario-nota-btn-excluir" onclick="excluirNotaDiario(\''+nota.id+'\')">🗑️ Excluir</button></div></div>';
                }).join('');
            }
            container.innerHTML='<div class="diario-screen"><p class="diario-date-title">'+dataFormatada+'</p><h1 class="diario-header-title">📖 Bloco de notas</h1><textarea class="diario-textarea" id="diarioTextarea" placeholder="Escreva suas anotações aqui..."></textarea><button class="diario-save-btn" onclick="salvarDiario()">💾 Salvar anotações</button><div class="diario-success-msg" id="diarioSuccess">✅ Salvo com sucesso!</div><div class="diario-notas-section"><h2 class="diario-notas-title">📝 Minhas anotações</h2><div id="diarioNotasLista">'+notasHtml+'</div></div></div>';
        }

        function salvarDiario(){
            const texto=document.getElementById('diarioTextarea');
            if(!texto)return;
            const conteudo=texto.value.trim();
            if(!conteudo){alert('Escreva alguma anotação antes de salvar.');return;}
            const notas=getNotasDiario();
            notas.push({id:Date.now().toString()+Math.random().toString(36).substr(2,5),texto:conteudo,data:new Date().toISOString()});
            salvarNotasDiario(notas);
            texto.value='';
            renderDiario(document.getElementById('screen-content'));
            const msg=document.getElementById('diarioSuccess');
            if(msg){msg.style.display='block';setTimeout(function(){msg.style.display='none';},2000);}
        }

        function editarNotaDiario(id){
            diarioNotaEditandoId=id;
            renderDiario(document.getElementById('screen-content'));
            setTimeout(function(){
                const campo=document.getElementById('diarioEdit_'+id);
                if(campo){campo.focus();campo.setSelectionRange(campo.value.length,campo.value.length);}
            },50);
        }

        function cancelarEdicaoDiario(){
            diarioNotaEditandoId=null;
            renderDiario(document.getElementById('screen-content'));
        }

        function salvarEdicaoDiario(id){
            const campo=document.getElementById('diarioEdit_'+id);
            if(!campo)return;
            const novoTexto=campo.value.trim();
            if(!novoTexto){alert('A anotação não pode ficar vazia.');return;}
            const notas=getNotasDiario();
            const indice=notas.findIndex(function(nota){return nota.id===id;});
            if(indice===-1)return;
            notas[indice].texto=novoTexto;
            notas[indice].data=notas[indice].data||new Date().toISOString();
            salvarNotasDiario(notas);
            diarioNotaEditandoId=null;
            renderDiario(document.getElementById('screen-content'));
        }

        function excluirNotaDiario(id){
            const notas=getNotasDiario();
            const indice=notas.findIndex(function(nota){return String(nota.id)===String(id);});
            if(indice===-1)return;

            notas.splice(indice,1);
            salvarNotasDiario(notas);

            if(diarioNotaEditandoId===id)diarioNotaEditandoId=null;

            renderDiario(document.getElementById('screen-content'));

            const lista=document.getElementById('diarioNotasLista');
            if(lista){
                const aviso=document.createElement('div');
                aviso.className='diario-success-msg';
                aviso.style.display='block';
                aviso.style.marginTop='8px';
                aviso.textContent='🗑️ Anotação excluída com sucesso!';
                lista.parentNode.insertBefore(aviso,lista);
                setTimeout(function(){
                    if(aviso.parentNode)aviso.parentNode.removeChild(aviso);
                },2000);
            }
        }

        // ========== PERFIL ==========
        function renderPerfil(container){
            const u=AppState.user||{nome:'Usuário'};
            const nome=u.nome||'Usuário';
            const pl=nome.charAt(0).toUpperCase();
            const fotoPerfil=localStorage.getItem('@organizame:foto_perfil')||'';
            const avatarHtml=fotoPerfil
                ? '<img src="'+fotoPerfil+'" class="perfil-avatar-img" alt="Foto de perfil" />'
                : '<span class="perfil-avatar-letra">'+pl+'</span>';

            container.innerHTML='<div class="perfil-screen">'+
                '<div class="perfil-card">'+
                    '<div class="perfil-avatar">'+avatarHtml+'</div>'+
                    '<h2 class="perfil-nome">'+nome+'</h2>'+
                    '<p class="perfil-foto-texto">Escolha uma foto para o seu perfil</p>'+
                    '<div class="perfil-foto-botoes">'+
                        '<button class="perfil-foto-btn" onclick="abrirSeletorFoto()">🖼️ Escolher foto</button>'+
                        '<button class="perfil-foto-btn" onclick="abrirCameraFoto()">📷 Tirar foto</button>'+
                    '</div>'+
                    '<input type="file" id="fotoPerfilUpload" class="perfil-foto-input" accept="image/*" onchange="processarFotoPerfil(this)" />'+
                    '<input type="file" id="fotoPerfilCamera" class="perfil-foto-input" accept="image/*" capture="environment" onchange="processarFotoPerfil(this)" />'+
                    (fotoPerfil ? '<button class="perfil-foto-btn secundario" style="margin-top:10px;" onclick="removerFotoPerfil()">🗑️ Remover foto</button>' : '')+
                '</div>'+
                '<button class="perfil-logout-btn" onclick="logout()">🚪 Sair da conta</button>'+
            '</div>';
        }

        function abrirSeletorFoto(){
            const input=document.getElementById('fotoPerfilUpload');
            if(input) input.click();
        }

        function abrirCameraFoto(){
            const input=document.getElementById('fotoPerfilCamera');
            if(input) input.click();
        }

        function processarFotoPerfil(input){
            if(!input || !input.files || !input.files[0]) return;
            const arquivo=input.files[0];
            if(!arquivo.type || arquivo.type.indexOf('image/')!==0){
                alert('Selecione uma imagem válida.');
                input.value='';
                return;
            }

            const leitor=new FileReader();
            leitor.onload=function(event){
                const img=new Image();
                img.onload=function(){
                    const tamanhoMaximo=800;
                    let largura=img.width;
                    let altura=img.height;

                    if(largura>tamanhoMaximo || altura>tamanhoMaximo){
                        const escala=Math.min(tamanhoMaximo/largura,tamanhoMaximo/altura);
                        largura=Math.round(largura*escala);
                        altura=Math.round(altura*escala);
                    }

                    const canvas=document.createElement('canvas');
                    canvas.width=largura;
                    canvas.height=altura;
                    const ctx=canvas.getContext('2d');
                    ctx.drawImage(img,0,0,largura,altura);

                    const fotoReduzida=canvas.toDataURL('image/jpeg',0.82);
                    try{
                        localStorage.setItem('@organizame:foto_perfil',fotoReduzida);
                        renderPerfil(document.getElementById('screen-content'));
                    }catch(error){
                        console.error('Erro ao salvar foto de perfil:',error);
                        alert('Não foi possível salvar essa foto. Tente uma imagem menor.');
                    }
                    input.value='';
                };
                img.onerror=function(){
                    alert('Não foi possível carregar a imagem.');
                    input.value='';
                };
                img.src=event.target.result;
            };
            leitor.onerror=function(){
                alert('Não foi possível ler a imagem.');
                input.value='';
            };
            leitor.readAsDataURL(arquivo);
        }

        function removerFotoPerfil(){
            if(confirm('Deseja remover sua foto de perfil?')){
                localStorage.removeItem('@organizame:foto_perfil');
                renderPerfil(document.getElementById('screen-content'));
            }
        }

        function logout(){if(confirm('Deseja realmente sair?')){localStorage.removeItem('user');AppState.user=null;navigateTo('Login');}}
        
            // ========== AGENDA ==========
        const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const HORARIOS = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00'];
        const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
        const DIAS_SEMANA_EXT = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
        let agendaCurrentDate = new Date();
        let agendaSelectedDate = new Date();
        let agendaSlots = {};
        let editingSlotId = null;
        let newSlotData = { titulo: '', descricao: '', horaInicio: '', horaFim: '', disponivel: true, recorrente: false, prioridade: 'media', cor: '#3B82F6', diasSemana: [] };
        let selectedDays = [];

        function getDateKey(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function loadAgendaSlots() {
            const user = AppState.user;
            const email = (user && user.email) || (user && user.nome) || 'usuario';
            try {
                const data = localStorage.getItem('@slots_' + email);
                agendaSlots = data ? JSON.parse(data) : {};
            } catch(e) {
                console.error('Erro ao carregar slots:', e);
                agendaSlots = {};
            }
        }

        function saveAgendaSlots(newData) {
            const user = AppState.user;
            const email = (user && user.email) || (user && user.nome) || 'usuario';
            try {
                localStorage.setItem('@slots_' + email, JSON.stringify(newData));
                agendaSlots = newData;
            } catch(e) {
                console.error('Erro ao salvar slots:', e);
            }
        }

        function getSlotsForDate(date) {
            const key = getDateKey(date);
            return agendaSlots[key] || [];
        }

        function renderAgenda(container) {
            loadAgendaSlots();
            container.innerHTML = '<div class="agenda-screen">' +
                '<div class="agenda-header-container"><div class="agenda-header"><h2 class="agenda-header-title">Minha Agenda</h2></div></div>' +
                '<div class="agenda-info-banner"><span>💡</span><span class="agenda-info-text">Escolha um dia para adicionar horário. Você pode adicionar <span class="agenda-info-bold">vários horários</span> no mesmo dia.</span></div>' +
                '<div class="agenda-calendar-controls">' +
                    '<button class="agenda-control-btn" onclick="agendaChangeMonth(-1)">◀</button>' +
                    '<button class="agenda-month-title" onclick="agendaGoToToday()"><span class="agenda-month-text" id="agendaMonthText"></span></button>' +
                    '<button class="agenda-control-btn" onclick="agendaChangeMonth(1)">▶</button>' +
                '</div>' +
                '<div class="agenda-week-header">' + DIAS_SEMANA.map(function(d) { return '<div class="agenda-week-day">' + d + '</div>'; }).join('') + '</div>' +
                '<div class="agenda-calendar-grid" id="agendaCalendarGrid"></div>' +
                '<div class="agenda-divider"></div>' +
                '<div class="agenda-day-detail-header"><div><div class="agenda-day-detail-title" id="agendaDayDetailTitle"></div><div class="agenda-day-detail-sub" id="agendaDayDetailSub"></div></div><button class="agenda-add-btn" onclick="abrirModal(false)">Agendar</button></div>' +
                '<div id="agendaDaySlots"></div>' +
                '<div style="height:40px;"></div></div>';
            atualizarCalendario();
        }

        function atualizarCalendario() {
            var mt = document.getElementById('agendaMonthText');
            if (mt) mt.textContent = MESES[agendaCurrentDate.getMonth()] + ' ' + agendaCurrentDate.getFullYear();
            
            var y = agendaCurrentDate.getFullYear();
            var m = agendaCurrentDate.getMonth();
            var firstDay = new Date(y, m, 1).getDay();
            var daysInMonth = new Date(y, m + 1, 0).getDate();
            
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            
            var grid = document.getElementById('agendaCalendarGrid');
            if (!grid) return;
            
            var html = '';
            for (var i = 0; i < firstDay; i++) {
                html += '<div class="agenda-day-cell"></div>';
            }
            
            for (var day = 1; day <= daysInMonth; day++) {
                var date = new Date(y, m, day);
                date.setHours(0, 0, 0, 0);
                var dateKey = getDateKey(date);
                var daySlots = agendaSlots[dateKey] || [];
                var isToday = date.getTime() === today.getTime();
                var isSelected = date.getTime() === agendaSelectedDate.getTime();
                var hasSlots = daySlots.length > 0;
                var availableSlots = 0;
                for (var j = 0; j < daySlots.length; j++) {
                    if (daySlots[j].disponivel) availableSlots++;
                }
                
                html += '<button class="agenda-day-cell' + (isToday ? ' agenda-day-today' : '') + (isSelected ? ' agenda-day-selected' : '') + (hasSlots ? ' agenda-day-has-slots' : '') + '" onclick="selecionarDia(' + y + ',' + m + ',' + day + ')" ondblclick="selecionarDia(' + y + ',' + m + ',' + day + ');abrirModal(false)">' +
                    '<span class="agenda-day-text' + (isToday ? ' agenda-day-text-today' : '') + (isSelected ? ' agenda-day-text-selected' : '') + '">' + day + '</span>' +
                    (hasSlots ? '<span class="agenda-day-dot' + (availableSlots === 0 ? ' agenda-day-dot-full' : '') + '"><span class="agenda-day-dot-text">' + availableSlots + '</span></span>' : '') +
                '</button>';
            }
            
            grid.innerHTML = html;
            atualizarDetalhesDia();
        }

        function selecionarDia(year, month, day) {
            agendaSelectedDate = new Date(year, month, day);
            agendaSelectedDate.setHours(0, 0, 0, 0);
            atualizarCalendario();
        }

        function agendaChangeMonth(delta) {
            var newDate = new Date(agendaCurrentDate);
            newDate.setMonth(newDate.getMonth() + delta);
            agendaCurrentDate = newDate;
            atualizarCalendario();
        }

        function agendaGoToToday() {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            agendaCurrentDate = new Date(today);
            agendaSelectedDate = new Date(today);
            atualizarCalendario();
        }

        function atualizarDetalhesDia() {
            var title = document.getElementById('agendaDayDetailTitle');
            var sub = document.getElementById('agendaDayDetailSub');
            var slotsContainer = document.getElementById('agendaDaySlots');
            
            if (!title || !sub || !slotsContainer) return;
            
            var options = { weekday: 'long', day: 'numeric', month: 'long' };
            title.textContent = agendaSelectedDate.toLocaleDateString('pt-BR', options);
            
            var daySlots = getSlotsForDate(agendaSelectedDate);
            sub.textContent = daySlots.length + ' compromissos';
            
            if (daySlots.length === 0) {
                slotsContainer.innerHTML = '<div class="agenda-empty-slots"><span style="font-size:40px;">📅</span><p class="agenda-empty-text">Nenhum compromisso neste dia</p><button class="agenda-add-btn" onclick="abrirModal(false)">Agendar</button></div>';
            } else {
                var sorted = daySlots.slice().sort(function(a, b) {
                    return a.horaInicio.localeCompare(b.horaInicio);
                });
                
                var html = '';
                for (var i = 0; i < sorted.length; i++) {
                    var slot = sorted[i];
                    var prioridadeClass = 'agenda-prioridade-' + slot.prioridade;
                    var prioridadeTexto = slot.prioridade === 'baixa' ? '🟢 Baixa' : slot.prioridade === 'media' ? '🟡 Média' : '🔴 Alta';
                    
                    html += '<div class="agenda-slot-card">' +
                        '<div class="agenda-slot-time">🕐 ' + slot.horaInicio + ' - ' + slot.horaFim + '</div>' +
                        '<div class="agenda-slot-titulo">' + (slot.titulo || 'Compromisso') + '</div>' +
                        (slot.descricao ? '<div class="agenda-slot-descricao">' + slot.descricao + '</div>' : '') +
                        '<div class="agenda-slot-tags">' +
                            '<span class="agenda-slot-tag ' + (slot.disponivel ? 'agenda-slot-available' : 'agenda-slot-occupied') + '">' + (slot.disponivel ? '📅 Disponível' : '👤 Agendado') + '</span>' +
                            '<span class="agenda-slot-tag ' + prioridadeClass + '">' + prioridadeTexto + '</span>' +
                        '</div>' +
                        '<div class="agenda-slot-actions">' +
                            (slot.disponivel ? '<button class="agenda-edit-btn" onclick="editarSlot(\'' + slot.id + '\')">✏️</button>' : '') +
                            '<button class="agenda-delete-btn" onclick="removerSlot(\'' + slot.id + '\')">🗑️</button>' +
                        '</div>' +
                    '</div>';
                }
                slotsContainer.innerHTML = html;
            }
        }

        function abrirModal(editing, preservarDados) {
            var modal = document.getElementById('agendaModal');
            var title = document.getElementById('modalTitle');
            var confirmText = document.getElementById('modalConfirmText');
            
            if (!modal) return;
            
            if (editing) {
                if (title) title.textContent = 'Editar Compromisso';
                if (confirmText) confirmText.textContent = 'Salvar alterações';
            } else {
                if (title) title.textContent = '📅 Novo Compromisso';
                if (confirmText) confirmText.textContent = 'Criar compromisso';
                if (!preservarDados) {
                    newSlotData = { titulo: '', descricao: '', horaInicio: '', horaFim: '', disponivel: true, recorrente: false, prioridade: 'media', cor: '#3B82F6', diasSemana: [] };
                    selectedDays = [];
                    editingSlotId = null;
                }
            }
            
            var dateStr = agendaSelectedDate.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
            var inicioGridHtml = '';
            for (var i = 0; i < HORARIOS.length; i++) {
                inicioGridHtml += '<div class="modal-horario-item' + (newSlotData.horaInicio === HORARIOS[i] ? ' active' : '') + '" onclick="selecionarHoraInicio(\'' + HORARIOS[i] + '\')">' + HORARIOS[i] + '</div>';
            }
            
            var fimGridHtml = '';
            for (var i = 0; i < HORARIOS.length; i++) {
                fimGridHtml += '<div class="modal-horario-item' + (newSlotData.horaFim === HORARIOS[i] ? ' active' : '') + '" onclick="selecionarHoraFim(\'' + HORARIOS[i] + '\')">' + HORARIOS[i] + '</div>';
            }
            
            var daysHtml = '';
            if (newSlotData.recorrente) {
                for (var i = 0; i < DIAS_SEMANA_EXT.length; i++) {
                    var isSelected = false;
                    for (var j = 0; j < selectedDays.length; j++) {
                        if (selectedDays[j] === i) { isSelected = true; break; }
                    }
                    daysHtml += '<div class="modal-day-chip' + (isSelected ? ' active' : '') + '" onclick="toggleDaySelection(' + i + ')">' + DIAS_SEMANA_EXT[i].substring(0, 3) + '</div>';
                }
            }
            
            var body = document.getElementById('modalBody');
            if (!body) return;
            
            body.innerHTML = '<div class="modal-date-container">📅 ' + dateStr + '</div>' +
                '<div class="modal-label">📌 Título do compromisso *</div>' +
                '<input class="modal-input" id="slotTitulo" placeholder="Ex: Consulta com Dr. João" value="' + newSlotData.titulo.replace(/"/g, '&quot;') + '" />' +
                '<div class="modal-label">📝 Descrição</div>' +
                '<textarea class="modal-input modal-textarea" id="slotDescricao" placeholder="Detalhes sobre o compromisso...">' + newSlotData.descricao + '</textarea>' +
                '<div class="modal-label">⏰ Horário de Início *</div>' +
                '<div class="modal-horario-grid">' + inicioGridHtml + '</div>' +
                '<div class="modal-label">⏰ Horário de Término *</div>' +
                '<div class="modal-horario-grid">' + fimGridHtml + '</div>' +
                '<div class="modal-label">🎯 Prioridade</div>' +
                '<div class="modal-prioridade-container">' +
                    '<div class="modal-prioridade-btn' + (newSlotData.prioridade === 'baixa' ? ' active' : '') + '" onclick="salvarCamposModalNoEstado();newSlotData.prioridade=\'baixa\';abrirModal(' + editing + ', true);">🟢 Baixa</div>' +
                    '<div class="modal-prioridade-btn' + (newSlotData.prioridade === 'media' ? ' active' : '') + '" onclick="salvarCamposModalNoEstado();newSlotData.prioridade=\'media\';abrirModal(' + editing + ', true);">🟡 Média</div>' +
                    '<div class="modal-prioridade-btn' + (newSlotData.prioridade === 'alta' ? ' active' : '') + '" onclick="salvarCamposModalNoEstado();newSlotData.prioridade=\'alta\';abrirModal(' + editing + ', true);">🔴 Alta</div>' +
                '</div>' +
                '<div class="modal-switch-row">' +
                    '<div class="modal-switch-left">🔄 Repetir semanalmente</div>' +
                    '<div class="modal-switch' + (newSlotData.recorrente ? ' on' : '') + '" onclick="toggleRecorrente()"><div class="modal-switch-thumb"></div></div>' +
                '</div>' +
                (newSlotData.recorrente ? '<div class="modal-days-selection"><div class="modal-days-title">Selecione os dias da semana:</div><div class="modal-days-grid">' + daysHtml + '</div><div class="modal-days-hint">' + (selectedDays.length === 0 ? '⚠️ Selecione pelo menos um dia' : '📌 Serão gerados horários para todos os ' + selectedDays.length + ' dias selecionados nas próximas semanas') + '</div></div>' : '');
            
            modal.classList.add('show');
        }

        function salvarCamposModalNoEstado() {
            var tituloInput = document.getElementById('slotTitulo');
            var descInput = document.getElementById('slotDescricao');
            if (tituloInput) newSlotData.titulo = tituloInput.value;
            if (descInput) newSlotData.descricao = descInput.value;
        }

        function selecionarHoraInicio(hora) {
            salvarCamposModalNoEstado();
            newSlotData.horaInicio = hora;
            abrirModal(!!editingSlotId, true);
        }

        function selecionarHoraFim(hora) {
            salvarCamposModalNoEstado();
            newSlotData.horaFim = hora;
            abrirModal(!!editingSlotId, true);
        }

        function toggleRecorrente() {
            salvarCamposModalNoEstado();
            newSlotData.recorrente = !newSlotData.recorrente;
            if (!newSlotData.recorrente) selectedDays = [];
            abrirModal(!!editingSlotId, true);
        }

        function toggleDaySelection(dayIndex) {
            salvarCamposModalNoEstado();
            var found = false;
            for (var i = 0; i < selectedDays.length; i++) {
                if (selectedDays[i] === dayIndex) {
                    selectedDays.splice(i, 1);
                    found = true;
                    break;
                }
            }
            if (!found) selectedDays.push(dayIndex);
            abrirModal(!!editingSlotId, true);
        }

        function fecharModal() {
            var modal = document.getElementById('agendaModal');
            if (modal) modal.classList.remove('show');
            editingSlotId = null;
        }

        function editarSlot(slotId) {
            var daySlots = getSlotsForDate(agendaSelectedDate);
            for (var i = 0; i < daySlots.length; i++) {
                if (daySlots[i].id === slotId) {
                    var slot = daySlots[i];
                    editingSlotId = slotId;
                    newSlotData = {
                        titulo: slot.titulo || '',
                        descricao: slot.descricao || '',
                        horaInicio: slot.horaInicio,
                        horaFim: slot.horaFim,
                        disponivel: slot.disponivel,
                        recorrente: false,
                        prioridade: slot.prioridade || 'media',
                        cor: slot.cor || '#3B82F6',
                        diasSemana: []
                    };
                    selectedDays = [];
                    abrirModal(true);
                    break;
                }
            }
        }

        function removerSlot(slotId) {
            if (!confirm('Remover este compromisso?')) return;
            
            var key = getDateKey(agendaSelectedDate);
            var currentSlots = agendaSlots[key] || [];
            var updatedSlots = [];
            
            for (var i = 0; i < currentSlots.length; i++) {
                if (currentSlots[i].id !== slotId) {
                    updatedSlots.push(currentSlots[i]);
                }
            }
            
            var updated = {};
            var keys = Object.keys(agendaSlots);
            for (var i = 0; i < keys.length; i++) {
                updated[keys[i]] = agendaSlots[keys[i]];
            }
            
            if (updatedSlots.length === 0) {
                delete updated[key];
            } else {
                updated[key] = updatedSlots;
            }
            
            saveAgendaSlots(updated);
            atualizarCalendario();
        }

        function salvarCompromisso() {
            var tituloInput = document.getElementById('slotTitulo');
            var descInput = document.getElementById('slotDescricao');
            
            var titulo = tituloInput ? tituloInput.value : newSlotData.titulo;
            var descricao = descInput ? descInput.value : newSlotData.descricao;
            
            newSlotData.titulo = titulo;
            newSlotData.descricao = descricao;
            
            if (!titulo || !newSlotData.horaInicio || !newSlotData.horaFim) {
                alert('Preencha todos os campos obrigatórios');
                return;
            }
            
            var key = getDateKey(agendaSelectedDate);
            var currentSlots = agendaSlots[key] || [];
            
            if (editingSlotId) {
                var updatedSlots = [];
                for (var i = 0; i < currentSlots.length; i++) {
                    if (currentSlots[i].id === editingSlotId) {
                        updatedSlots.push({
                            id: currentSlots[i].id,
                            titulo: titulo,
                            descricao: descricao,
                            horaInicio: newSlotData.horaInicio,
                            horaFim: newSlotData.horaFim,
                            disponivel: currentSlots[i].disponivel,
                            prioridade: newSlotData.prioridade,
                            cor: newSlotData.cor,
                            pacienteAgendado: currentSlots[i].pacienteAgendado,
                            data: key
                        });
                    } else {
                        updatedSlots.push(currentSlots[i]);
                    }
                }
                
                var updated = {};
                var keys = Object.keys(agendaSlots);
                for (var i = 0; i < keys.length; i++) {
                    updated[keys[i]] = agendaSlots[keys[i]];
                }
                updated[key] = updatedSlots;
                saveAgendaSlots(updated);
                
            } else {
                if (newSlotData.recorrente && selectedDays.length > 0) {
                    var added = 0;
                    var today = new Date();
                    today.setHours(0, 0, 0, 0);
                    
                    var updated = {};
                    var keys = Object.keys(agendaSlots);
                    for (var i = 0; i < keys.length; i++) {
                        updated[keys[i]] = agendaSlots[keys[i]];
                    }
                    
                    for (var i = 0; i < 60; i++) {
                        var futureDate = new Date(today);
                        futureDate.setDate(futureDate.getDate() + i);
                        var dayOfWeek = futureDate.getDay();
                        
                        var isSelected = false;
                        for (var j = 0; j < selectedDays.length; j++) {
                            if (selectedDays[j] === dayOfWeek) { isSelected = true; break; }
                        }
                        
                        if (isSelected && futureDate >= today) {
                            var fKey = getDateKey(futureDate);
                            var fSlots = updated[fKey] || [];
                            fSlots.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                titulo: titulo,
                                descricao: descricao,
                                horaInicio: newSlotData.horaInicio,
                                horaFim: newSlotData.horaFim,
                                disponivel: true,
                                prioridade: newSlotData.prioridade,
                                cor: newSlotData.cor,
                                pacienteAgendado: null,
                                data: fKey
                            });
                            updated[fKey] = fSlots;
                            added++;
                        }
                    }
                    
                    saveAgendaSlots(updated);
                    alert(added + ' horários adicionados com sucesso!');
                } else {
                    var newSlot = {
                        id: Date.now().toString(),
                        titulo: titulo,
                        descricao: descricao,
                        horaInicio: newSlotData.horaInicio,
                        horaFim: newSlotData.horaFim,
                        disponivel: true,
                        prioridade: newSlotData.prioridade,
                        cor: newSlotData.cor,
                        pacienteAgendado: null,
                        data: key
                    };
                    
                    var updated = {};
                    var keys = Object.keys(agendaSlots);
                    for (var i = 0; i < keys.length; i++) {
                        updated[keys[i]] = agendaSlots[keys[i]];
                    }
                    updated[key] = currentSlots.concat([newSlot]);
                    saveAgendaSlots(updated);
                }
            }
            
            fecharModal();
            newSlotData = { titulo: '', descricao: '', horaInicio: '', horaFim: '', disponivel: true, recorrente: false, prioridade: 'media', cor: '#3B82F6', diasSemana: [] };
            selectedDays = [];
            editingSlotId = null;
            atualizarCalendario();
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                AppState.loadingSessao = false;
                var savedUser = localStorage.getItem('user');
                if (savedUser) {
                    try {
                        AppState.user = JSON.parse(savedUser);
                        navigateTo('MainApp');
                    } catch(e) {
                        console.error('Erro ao carregar usuário:', e);
                        localStorage.removeItem('user');
                        navigateTo('Login');
                    }
                } else {
                    navigateTo('Login');
                }
            }, 500);
        });

        // Fechar modal ao clicar fora
        document.addEventListener('click', function(e) {
            var modal = document.getElementById('agendaModal');
            if (e.target === modal) {
                fecharModal();
            }
        });
    </script>
</body>
</html>
